  <g stroke="#22D3EE" stroke-width="1.5" stroke-linecap="round">
    <line x1="16"    y1="13.1"  x2="16"    y2="8.9"/>
    <line x1="18.51" y1="14.55" x2="22.15" y2="12.45"/>
    <line x1="18.51" y1="17.45" x2="22.15" y2="19.55"/>
    <line x1="16"    y1="18.9"  x2="16"    y2="23.1"/>
    <line x1="13.49" y1="17.45" x2="9.85"  y2="19.55"/>
    <line x1="13.49" y1="14.55" x2="9.85"  y2="12.45"/>
  </g>
  <g>
    <circle cx="16"    cy="7"    r="1.6" fill="#22D3EE"/>
    <circle cx="23.79" cy="11.5" r="1.6" fill="#A78BFA"/>
    <circle cx="23.79" cy="20.5" r="1.6" fill="#34D399"/>
    <circle cx="16"    cy="25"   r="1.6" fill="#22D3EE"/>
    <circle cx="8.21"  cy="20.5" r="1.6" fill="#60A5FA"/>
    <circle cx="8.21"  cy="11.5" r="1.6" fill="#E08C3C"/>
