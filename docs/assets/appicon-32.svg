<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Vibe Stats — simplified small app icon (32 px and below)</title>
  <!-- No orbit rings, no dot field, no glow, no specular. Spokes thickened to
       hold the same optical weight. Drawn, never downscaled from the 1024. -->
